# Candidate playbook: the judgement rules from the pr-review / pr-feedback skills.
#
# Derived from v4 (pv_e160b0e63df746f784ca78a5), the eval control arm, by adding persona text
# only — no model binding, router rule, gate or env spec differs from v4, so an eval of this
# against v4 measures the prompt change and nothing else.
#
# Source of the imported rules: github.com/mustafarslan/skills (MIT, same author) — SKILL.md
# for pr-review, sections 4 (disprove first), 5 (always critical), 6A (contracts, flows),
# 6B (agents and models), 10 (do not report), 12 (verbatim, negations).
#
# The rules went into personas rather than the fixed contract in packages/playbook/src/prompt.ts
# on purpose: the contract is code shared by every version, so editing it would move the control
# arm too and there would be nothing to compare against.
#
# Published as v9 (pv_5102e10639e841f2bf489072), inactive and unmeasured. See docs/STATUS.md 254.
