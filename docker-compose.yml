# Deployment wrapper around the same binary the installer gives you.
#
# Maestro is a single executable; Compose only supplies a place to run it, a volume for
# its SQLite database and workspaces, and the Docker socket it needs to create sandboxes.
#
# The image builds and runs, both listeners bind, and the admin API enforces its token —
# all verified. The sandbox-to-proxy path is the part that was hardest to get right; it
# now uses this project's own network rather than a host gateway address, so it no longer
# depends on the platform. `maestro serve` on the host remains the simplest deployment.
services:
  maestro:
    build: .
    restart: unless-stopped
    environment:
      # Provider credentials. Only the ones you actually use are needed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      # Ollama on the host, for local or Ollama Cloud models without a hosted key. Inside the
      # container `localhost` is the container, so point it at the host:
      # OLLAMA_HOST=http://host.docker.internal:11434. Read when the database is first created,
      # so set it before the first `docker compose up`. Put it in a `.env` file beside this one
      # rather than exporting it in your shell: Ollama reads the same variable as the address it
      # listens on, and on the host `host.docker.internal` does not resolve, so an Ollama started
      # from that shell fails with "lookup host.docker.internal: no such host".
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      # Linear, optional: lets the product agent check the diff against the issue's
      # acceptance criteria instead of only the author's own PR description.
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_PREFIXES: ${LINEAR_TEAM_PREFIXES:-}
      # GitHub App (preferred) or a PAT for a single-user setup.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set a webhook secret}
      MAESTRO_ADMIN_TOKEN: ${MAESTRO_ADMIN_TOKEN:?set an admin token}
      MAESTRO_HOME: /data
      # Sandboxes are created through the Docker socket, so they are siblings of this
      # container rather than children of it, and they must be able to reach the egress
      # proxy that runs inside it during the prepare phase.
      #
      # They join this compose project's own network and dial this container by name.
      # Docker's embedded DNS resolves it, the traffic never leaves the daemon, and
      # nothing is published on any host interface.
      #
      # The previous approach published the proxy on the docker bridge gateway
      # (172.17.0.1) and was wrong twice over: that address is a real interface only on
      # Linux, so the container failed to start at all on Docker Desktop with "can't
      # assign requested address"; and it sent container-to-container traffic out to the
      # host and back for no reason.
      #
      # Only the prepare phase joins this network. Analyze still runs with
      # `--network none`, so the isolation the whole design rests on is unchanged.
      #
      # Needed only under `egressEnforcement: advisory`. The enforced default does not
      # use it at all: the review gets its own --internal network, the proxy runs in a
      # container on it, and the sandbox reaches that proxy by name through Docker's
      # embedded DNS — none of which involves Maestro's own network or address. Left set
      # so switching an install to advisory keeps working without editing this file.
      MAESTRO_SANDBOX_NETWORK: ${COMPOSE_PROJECT_NAME:-maestro}_default
    volumes:
      - maestro-data:/data
      # Sandboxes are sibling containers on the host daemon. This grants Maestro
      # control of that daemon: run it on a host you would trust with that, and note
      # that agent containers themselves never receive the socket.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Webhooks: the only port that needs to be reachable from GitHub.
      - "8080:8080"
      # Admin UI: bound to loopback on the host, because it is not authenticated by
      # anything other than the token and has no business on a public interface.
      - "127.0.0.1:7777:7777"
    # Requires an actual HTTP response, so it fails if the event loop is blocked rather
    # than only if the process has exited. `/` is the UI, which is deliberately served
    # without a token — the browser has to load it before it can send one — so the check
    # needs no credential.
    #
    # `restart: unless-stopped` acts on exit, not on a hang; this is what makes a hang
    # visible in `docker ps` and to anything watching health.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7777/"]
      interval: 30s
      timeout: 5s
      # Generous: the first start runs migrations and seeds the default playbook.
      start_period: 30s
      retries: 3

    command:
      - serve
      - --webhook-port=8080
      - --admin-port=7777
      - --admin-host=0.0.0.0

volumes:
  maestro-data:
