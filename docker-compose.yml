# Deployment wrapper around the same binary the installer gives you.
#
# Maestro is a single executable; Compose only supplies a place to run it, a volume for
# its SQLite database and workspaces, and the Docker socket it needs to create sandboxes.
#
# EXPERIMENTAL. This file has not been run end to end — it needs a Linux host with the
# Docker socket mounted, and the maintainer's testing was on macOS. The sandbox-to-proxy
# path below is the part most likely to need adjusting for your daemon's bridge; if
# dependency installs fail, that is where to look. `maestro serve` on the host is the
# supported deployment.
services:
  maestro:
    build: .
    restart: unless-stopped
    environment:
      # Provider credentials. Only the ones you actually use are needed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      # Linear, optional: lets the product agent check the diff against the issue's
      # acceptance criteria instead of only the author's own PR description.
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_PREFIXES: ${LINEAR_TEAM_PREFIXES:-}
      # GitHub App (preferred) or a PAT for a single-user setup.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set a webhook secret}
      MAESTRO_ADMIN_TOKEN: ${MAESTRO_ADMIN_TOKEN:?set an admin token}
      MAESTRO_HOME: /data
      # Sandboxes are siblings on the HOST daemon, so they cannot reach this
      # container's loopback. Two things have to line up, and both are here:
      #
      #   1. the proxy binds a port that is PUBLISHED below — an ephemeral port cannot
      #      be, so a range is pinned. It is a range, not one port, because concurrent
      #      reviews each run their own proxy; the range width caps how many prepare
      #      phases can run at once.
      #   2. sandboxes are told an address that reaches this container. 172.17.0.1 is
      #      the default bridge gateway; change it if your daemon uses a different one.
      #
      # Getting either wrong makes every dependency install fail.
      MAESTRO_PROXY_HOST: ${MAESTRO_PROXY_HOST:-172.17.0.1}
      MAESTRO_PROXY_PORT_RANGE: ${MAESTRO_PROXY_PORT_RANGE:-7790-7799}
    volumes:
      - maestro-data:/data
      # Sandboxes are sibling containers on the host daemon. This grants Maestro
      # control of that daemon: run it on a host you would trust with that, and note
      # that agent containers themselves never receive the socket.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Webhooks: the only port that needs to be reachable from GitHub.
      - "8080:8080"
      # Admin UI: bound to loopback on the host, because it is not authenticated by
      # anything other than the token and has no business on a public interface.
      - "127.0.0.1:7777:7777"
      # Egress proxy, reachable by sibling sandbox containers over the bridge gateway
      # only — never on the LAN. Must match MAESTRO_PROXY_PORT_RANGE above.
      - "172.17.0.1:7790-7799:7790-7799"
    command:
      - serve
      - --webhook-port=8080
      - --admin-port=7777
      - --admin-host=0.0.0.0

volumes:
  maestro-data:
