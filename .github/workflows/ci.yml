name: CI

# Every push to master, every pull request, and on demand.
#
# This was manual-only while the repository was private: the account has no Actions credit, so
# each run failed for want of minutes rather than for anything about the code, and a red tick
# that means "billing" trains you to ignore red ticks. Public repositories get standard runners
# free, so the triggers are back — which matters most for a pull request from someone else,
# where the Docker suite below is what checks that the sandbox posture still holds.
#
# The same steps also run locally in `scripts/gate.sh`, which is what every commit here goes
# through: install from a clean checkout, lint, typecheck, docs, tests, the store contract on
# both runtimes, the compiled binary, the queue race, MCP over stdio, a smoke test of a fresh
# install, and the advisory Linear query check.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push makes an older run's result irrelevant; paying for it is pure waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone. The golden set records the commit each
      # fixture was cut from, and `golden-set.test.ts` checks those commits are reachable —
      # which is exactly the check that cannot run against a depth-1 clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No version here: package.json's `packageManager` field is the single source, and
      # naming a version in both is a hard error rather than a fallback.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # A link, script, subcommand or task a document refers to and that no longer exists.
      # The prose half of honest documentation cannot be automated; this half can.
      - run: node scripts/docs-check.mjs

      # The Docker integration suite asserts the sandbox security posture against real
      # containers. It runs here because a typo in a `docker run` flag is otherwise
      # completely silent, and that posture is what makes it safe to review a
      # stranger's code at all.
      - run: pnpm test

      # vitest runs on Node, so every test above exercises node:sqlite. The binary ships
      # bun:sqlite — two implementations behind one interface, and only one of them was
      # ever run until this check existed. It found `get()` returning null on bun where
      # node returns undefined, on a driver whose declared type said undefined.
      - name: Store driver contract, on both runtimes
        run: |
          pnpm run build
          node --experimental-strip-types scripts/store-contract-check.ts
          bun scripts/store-contract-check.ts

      - run: pnpm run build:binary

      # `maestro mcp` speaks JSON-RPC on stdout. A stray console.log or a log line that
      # forgot it belongs on stderr corrupts the stream and every client disconnects with
      # a parse error naming nothing. That only exists once the server is a subprocess
      # with stdout as a pipe, which no unit test reproduces.
      # The queue's core promise — no job claimed twice — only exists across processes.
      - name: Queue claim race, five processes on one database
        run: node scripts/queue-race-check.mjs

      - name: MCP protocol, against the compiled binary
        # The script provisions and cleans up its own MAESTRO_HOME: it used to inherit
        # whatever the caller had, which made the result depend on ambient state.
        run: node scripts/mcp-protocol-check.mjs ./dist/maestro

      - name: Smoke-test the compiled binary
        run: |
          ./dist/maestro --version
          MAESTRO_HOME=$(mktemp -d) ./dist/maestro init
          MAESTRO_HOME=$(mktemp -d) ./dist/maestro playbook nodes

      # Linear owns this schema and can change it without telling us. The check needs no
      # credential — Linear validates a query before it authenticates — so it runs here
      # rather than waiting for somebody to notice issue lookup had quietly stopped
      # working. Non-blocking: their availability is not our build's business.
      - name: Linear query shape (advisory)
        continue-on-error: true
        run: node scripts/live-linear-check.mjs
